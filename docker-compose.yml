services:
  webapp:
    build: ./webapp
    container_name: webapp
    ports:
      - "28080:8080"
    volumes:
      - ./webapp/app:/usr/local/tomcat/webapps/example
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: Useruseruser1#!
      MYSQL_DATABASE: user
      MYSQL_USER: user
      MYSQL_PASSWORD: Useruseruser1#!
    ports:
      - "23306:3306"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
